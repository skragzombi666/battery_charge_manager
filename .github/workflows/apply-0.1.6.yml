name: Apply 0.1.6 metadata fix

on:
  push:
    branches:
      - fix/0.1.6
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/fix/0.1.6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply 0.1.6 changes
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected one match, got {text.count(old)}")
              return text.replace(old, new, 1)

          manager = Path("custom_components/battery_charge_manager/manager.py")
          text = manager.read_text(encoding="utf-8")
          old = '''        raw_capacity = data.get("nominal_capacity_mah")
          if raw_capacity in {None, ""}:
              raise HomeAssistantError("Nominal capacity is required")
          try:
              nominal_capacity_mah = int(float(raw_capacity))
          except (TypeError, ValueError) as err:
              raise HomeAssistantError("Nominal capacity must be a number") from err
          if nominal_capacity_mah <= 0:
              raise HomeAssistantError("Nominal capacity must be greater than zero")
          nominal_voltage_v = self._optional_positive_float(data.get("nominal_voltage_v"))
          nominal_energy_wh = self._optional_positive_float(data.get("nominal_energy_wh"))
          '''.replace("          ", "        ", 1)
          new = '''        raw_capacity = data.get("nominal_capacity_mah")
          nominal_capacity_mah = None
          if raw_capacity not in {None, ""}:
              try:
                  nominal_capacity_mah = int(float(raw_capacity))
              except (TypeError, ValueError) as err:
                  raise HomeAssistantError("Nominal capacity must be a number") from err
              if nominal_capacity_mah <= 0:
                  raise HomeAssistantError("Nominal capacity must be greater than zero")
          nominal_voltage_v = self._optional_positive_float(data.get("nominal_voltage_v"))
          nominal_energy_wh = self._optional_positive_float(data.get("nominal_energy_wh"))
          if nominal_capacity_mah is None and nominal_energy_wh is None:
              raise HomeAssistantError(
                  "Nominal capacity or nominal energy is required"
              )
          '''.replace("          ", "        ", 1)
          text = replace_once(text, old, new, "manager capacity validation")
          manager.write_text(text, encoding="utf-8")

          models = Path("custom_components/battery_charge_manager/models.py")
          text = models.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "    nominal_capacity_mah: int\n",
              "    nominal_capacity_mah: int | None\n",
              "battery capacity type",
          )
          text = replace_once(
              text,
              '            nominal_capacity_mah=_int_or(data.get("nominal_capacity_mah"), 1000),\n',
              '            nominal_capacity_mah=(\n                _int_or(data.get("nominal_capacity_mah"), 0)\n                if data.get("nominal_capacity_mah") not in {None, ""}\n                else None\n            ),\n',
              "battery capacity deserialization",
          )
          models.write_text(text, encoding="utf-8")

          frontend = Path("custom_components/battery_charge_manager/frontend/battery-charge-manager.js")
          text = frontend.read_text(encoding="utf-8")
          text = replace_once(text, '    energy: "Nennenergie (Wh)",', '    energy: "Nennenergie (mWh)",', "German energy label")
          text = replace_once(text, '    energy: "Nominal energy (Wh)",', '    energy: "Nominal energy (mWh)",', "English energy label")
          text = replace_once(
              text,
              '${this.input("nominal_capacity_mah",this.t("capacity"),d.nominal_capacity_mah ?? "",true,"number")}${this.input("nominal_voltage_v",this.t("voltage"),d.nominal_voltage_v,"", "number", "0.01")}${this.input("nominal_energy_wh",this.t("energy"),d.nominal_energy_wh,"", "number", "0.01")}',
              '${this.input("nominal_capacity_mah",this.t("capacity"),d.nominal_capacity_mah ?? "",false,"number")}${this.input("nominal_voltage_v",this.t("voltage"),d.nominal_voltage_v,"", "number", "0.01")}${this.input("nominal_energy_mwh",this.t("energy"),d.nominal_energy_mwh ?? (d.nominal_energy_wh === null || d.nominal_energy_wh === undefined ? "" : Number(d.nominal_energy_wh) * 1000),false,"number","1")}',
              "battery dialog energy field",
          )
          text = replace_once(
              text,
              '      d.nominal_energy_wh = d.nominal_energy_wh === "" || d.nominal_energy_wh === undefined ? null : Number(d.nominal_energy_wh);\n',
              '      if (d.nominal_energy_mwh !== undefined) {\n        d.nominal_energy_wh = d.nominal_energy_mwh === "" || d.nominal_energy_mwh === null ? null : Number(d.nominal_energy_mwh) / 1000;\n      }\n      delete d.nominal_energy_mwh;\n',
              "battery mWh normalization",
          )
          text = replace_once(
              text,
              '  batteryItem(battery, admin) {\n    const img = imageUrl(battery.image);\n',
              '  batteryItem(battery, admin) {\n    const img = imageUrl(battery.image);\n    const nominalSpecs = [\n      battery.nominal_capacity_mah !== null && battery.nominal_capacity_mah !== undefined ? `${battery.nominal_capacity_mah} mAh` : "",\n      battery.nominal_energy_wh !== null && battery.nominal_energy_wh !== undefined ? `${fmt(Number(battery.nominal_energy_wh) * 1000,0)} mWh` : "",\n    ].filter(Boolean).join(" · ") || "–";\n',
              "battery list specs",
          )
          text = replace_once(
              text,
              '${esc(battery.technology)} · ${esc(battery.form_factor)} · ${battery.nominal_capacity_mah} mAh',
              '${esc(battery.technology)} · ${esc(battery.form_factor)} · ${esc(nominalSpecs)}',
              "battery list capacity display",
          )
          frontend.write_text(text, encoding="utf-8")

          const = Path("custom_components/battery_charge_manager/const.py")
          text = const.read_text(encoding="utf-8")
          text = replace_once(text, 'VERSION = "0.1.5"', 'VERSION = "0.1.6"', "const version")
          const.write_text(text, encoding="utf-8")

          manifest = Path("custom_components/battery_charge_manager/manifest.json")
          data = json.loads(manifest.read_text(encoding="utf-8"))
          if data.get("version") != "0.1.5":
              raise SystemExit(f"Unexpected manifest version {data.get('version')}")
          data["version"] = "0.1.6"
          manifest.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          if "## 0.1.6" not in text:
              text = text.replace(
                  "# Changelog\n\n",
                  "# Changelog\n\n## 0.1.6\n\n- Nominal capacity in mAh is no longer mandatory when nominal energy is available.\n- Nominal energy is entered in mWh in the UI (for example 3600 mWh) and remains stored internally in Wh.\n- Battery summaries show whichever nominal capacity/energy metadata is available.\n\n",
                  1,
              )
              changelog.write_text(text, encoding="utf-8")
      - name: Frontend regression tests
        run: node --test tests/*.mjs
      - name: Frontend syntax
        run: node --check custom_components/battery_charge_manager/frontend/battery-charge-manager.js
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components CHANGELOG.md
          git commit -m "Make nominal mAh capacity optional"
          git push
