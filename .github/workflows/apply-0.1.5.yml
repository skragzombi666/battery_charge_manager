name: Apply 0.1.5 fix

on:
  push:
    branches:
      - fix/0.1.5
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/fix/0.1.5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply 0.1.5 changes
        shell: python
        run: |
          from pathlib import Path
          import json

          frontend = Path("custom_components/battery_charge_manager/frontend/battery-charge-manager.js")
          content = frontend.read_text(encoding="utf-8")

          old = '    const d = this._draft;\n    if (this._dialog === "battery") {'
          new = '    const d = this._draft;\n    const dialogError = this._error ? `<div class="bcm-error bcm-dialog-error"><strong>${this.t("error")}:</strong> ${esc(this._error)}</div>` : "";\n    if (this._dialog === "battery") {'
          if old in content:
              content = content.replace(old, new, 1)
          elif 'const dialogError = this._error ?' not in content:
              raise SystemExit("Could not add dialog-local error rendering")

          old = '<div class="bcm-dialog"><h2>${d.battery_id ? this.t("edit") : this.t("addBattery")}</h2><div class="bcm-form-grid">'
          new = '<div class="bcm-dialog"><h2>${d.battery_id ? this.t("edit") : this.t("addBattery")}</h2>${dialogError}<div class="bcm-form-grid">'
          if old in content:
              content = content.replace(old, new, 1)
          elif new not in content:
              raise SystemExit("Could not add battery dialog error")

          old = '<div class="bcm-dialog"><h2>${d.setup_id ? this.t("edit") : this.t("addSetup")}</h2><div class="bcm-form-grid">'
          new = '<div class="bcm-dialog"><h2>${d.setup_id ? this.t("edit") : this.t("addSetup")}</h2>${dialogError}<div class="bcm-form-grid">'
          if old in content:
              content = content.replace(old, new, 1)
          elif new not in content:
              raise SystemExit("Could not add setup dialog error")

          old = 'if (!customElements.get("battery-charge-manager-panel")) customElements.define("battery-charge-manager-panel", BatteryChargeManagerPanel);'
          new = '''const requestedPanelElement = (() => {
            try {
              const value = new URL(import.meta.url).searchParams.get("panel") || "";
              return /^battery-charge-manager-panel-r[a-f0-9]{12}$/.test(value)
                ? value
                : "battery-charge-manager-panel";
            } catch (_err) {
              return "battery-charge-manager-panel";
            }
          })();
          if (!customElements.get(requestedPanelElement)) customElements.define(requestedPanelElement, BatteryChargeManagerPanel);'''
          if old in content:
              content = content.replace(old, new, 1)
          elif 'const requestedPanelElement = (() =>' not in content:
              raise SystemExit("Could not add revision-specific panel registration")

          frontend.write_text(content, encoding="utf-8")

          panel = Path("custom_components/battery_charge_manager/panel.py")
          content = panel.read_text(encoding="utf-8")
          old = '    revision = _frontend_revision()\n    module_url = f"{FRONTEND_MODULE_URL}?v={version}-{revision}"'
          new = '    revision = _frontend_revision()\n    panel_element_name = f"{PANEL_ELEMENT_NAME}-r{revision}"\n    module_url = (\n        f"{FRONTEND_MODULE_URL}?v={version}-{revision}"\n        f"&panel={panel_element_name}"\n    )'
          if old in content:
              content = content.replace(old, new, 1)
          elif 'panel_element_name = f"{PANEL_ELEMENT_NAME}-r{revision}"' not in content:
              raise SystemExit("Could not add versioned panel name")
          old = '                "name": PANEL_ELEMENT_NAME,'
          new = '                "name": panel_element_name,'
          if old in content:
              content = content.replace(old, new, 1)
          elif new not in content:
              raise SystemExit("Could not wire versioned panel name")
          panel.write_text(content, encoding="utf-8")

          const = Path("custom_components/battery_charge_manager/const.py")
          content = const.read_text(encoding="utf-8")
          content = content.replace('VERSION = "0.1.4"', 'VERSION = "0.1.5"', 1)
          const.write_text(content, encoding="utf-8")

          manifest = Path("custom_components/battery_charge_manager/manifest.json")
          data = json.loads(manifest.read_text(encoding="utf-8"))
          data["version"] = "0.1.5"
          manifest.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          content = changelog.read_text(encoding="utf-8")
          if "## 0.1.5" not in content:
              content = content.replace(
                  "# Changelog\n\n",
                  "# Changelog\n\n## 0.1.5\n\n- Fixed stale Battery Charge Manager panel code surviving upgrades in long-lived Home Assistant browser/WebView sessions by registering a revision-specific custom element for each frontend build.\n- This ensures newly added setup controls such as direct image upload and current save-dialog behavior are actually used after an integration update.\n- Save errors are now displayed inside the open edit dialog instead of only behind the modal overlay.\n\n",
                  1,
              )
              changelog.write_text(content, encoding="utf-8")
      - name: Frontend regression tests
        run: node --test tests/*.mjs
      - name: Frontend syntax
        run: node --check custom_components/battery_charge_manager/frontend/battery-charge-manager.js
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components CHANGELOG.md
          git commit -m "Fix stale panel frontend after upgrades"
          git push
