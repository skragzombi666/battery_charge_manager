name: Apply 0.1.4 fix

on:
  push:
    branches:
      - fix/0.1.4
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/fix/0.1.4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply fix
        shell: python
        run: |
          from pathlib import Path
          import json

          frontend = Path("custom_components/battery_charge_manager/frontend/battery-charge-manager.js")
          content = frontend.read_text(encoding="utf-8")
          old = 'd.max_temperature_c = d.max_temperature_c === "" ? null : Number(d.max_temperature_c);'
          new = 'd.max_temperature_c = d.max_temperature_c === "" || d.max_temperature_c === null || d.max_temperature_c === undefined ? null : Number(d.max_temperature_c);'
          if old in content:
              content = content.replace(old, new, 1)
              frontend.write_text(content, encoding="utf-8")
          elif new not in content:
              raise SystemExit("Expected max_temperature_c normalization not found")

          const = Path("custom_components/battery_charge_manager/const.py")
          content = const.read_text(encoding="utf-8")
          content = content.replace('VERSION = "0.1.3"', 'VERSION = "0.1.4"', 1)
          const.write_text(content, encoding="utf-8")

          manifest = Path("custom_components/battery_charge_manager/manifest.json")
          data = json.loads(manifest.read_text(encoding="utf-8"))
          data["version"] = "0.1.4"
          manifest.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          content = changelog.read_text(encoding="utf-8")
          heading = "## 0.1.4"
          if heading not in content:
              content = content.replace(
                  "# Changelog\n\n",
                  "# Changelog\n\n## 0.1.4\n\n- Fixed editing charging setups with an unset optional temperature safety limit; `null` is no longer converted to `0` before saving.\n- Added a regression test covering the exact `null` to `0` failure reported from the mobile setup dialog.\n\n",
                  1,
              )
              changelog.write_text(content, encoding="utf-8")
      - name: Frontend regression tests
        run: node --test tests/*.mjs
      - name: Frontend syntax
        run: node --check custom_components/battery_charge_manager/frontend/battery-charge-manager.js
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No fix changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components CHANGELOG.md
          git commit -m "Fix optional setup temperature limit normalization"
          git push
