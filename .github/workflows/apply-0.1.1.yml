name: Apply 0.1.1 implementation

on:
  push:
    branches:
      - fix/0.1.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/fix/0.1.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply backend changes
        run: python tools/apply_0_1_1_backend.py
      - name: Apply frontend changes
        run: python tools/apply_0_1_1_frontend.py
      - name: Compile Python
        run: python -m compileall custom_components tests tools
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Run frontend tests
        run: node --test tests/test_frontend.mjs
      - name: Check frontend syntax
        run: node --check custom_components/battery_charge_manager/frontend/battery-charge-manager.js
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components CHANGELOG.md docs/version-0.1.1.md
          git commit -m "Implement Battery Charge Manager 0.1.1"
          git push
