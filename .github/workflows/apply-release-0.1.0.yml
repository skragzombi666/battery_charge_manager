name: Apply Battery Charge Manager 0.1.0

on:
  push:
    branches:
      - main
    paths:
      - .release/chunks/**
      - .github/workflows/apply-release-0.1.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Apply clean 0.1.0 source tree
        shell: bash
        run: |
          cat .release/chunks/part-* | base64 --decode > /tmp/battery-charge-manager-0.1.0.tar.gz
          echo "889b9d9cc970b45e632719d9c741454383fbc204571bf146d7d4e9833a8ce869  /tmp/battery-charge-manager-0.1.0.tar.gz" | sha256sum --check
          tar -xzf /tmp/battery-charge-manager-0.1.0.tar.gz -C .
          rm -rf .release
          rm -f .github/workflows/apply-release-0.1.0.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Validate Python and JSON
        shell: bash
        run: |
          python -m compileall -q custom_components/battery_charge_manager
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          PY
      - name: Validate frontend JavaScript
        run: node --check custom_components/battery_charge_manager/frontend/battery-charge-manager.js
      - name: Run core unit tests
        run: python -m unittest discover -s tests -v
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: "description topics license"
      - name: Home Assistant hassfest
        uses: home-assistant/actions/hassfest@master
      - name: Commit and push 0.1.0
        id: commit
        shell: bash
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Battery Charge Manager 0.1.0"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Create 0.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "Release v0.1.0 already exists."
            exit 0
          fi
          gh release create v0.1.0 --target "$SHA" --title "Battery Charge Manager 0.1.0" --latest --notes-file docs/version-0.1.0.md
