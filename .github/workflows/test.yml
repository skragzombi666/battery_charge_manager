name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Frontend regression tests
        run: node --test tests/test_frontend.mjs
      - name: Frontend syntax
        run: node --check custom_components/battery_charge_manager/frontend/battery-charge-manager.js
