name: Apply idle clamp fix

on:
  push:
    branches:
      - fix/0.1.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/fix/0.1.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Patch backend clamp
        shell: python
        run: |
          from pathlib import Path

          path = Path("custom_components/battery_charge_manager/manager.py")
          content = path.read_text(encoding="utf-8")
          old = (
              "        if mode == IDLE_MODE_FIXED:\n"
              "            duration_minutes = max(\n"
              "                5.0,\n"
              "                float(duration_minutes or DEFAULT_IDLE_FIXED_MINUTES),\n"
              "            )\n"
          )
          new = (
              "        if mode == IDLE_MODE_FIXED:\n"
              "            requested_duration = (\n"
              "                DEFAULT_IDLE_FIXED_MINUTES\n"
              "                if duration_minutes is None\n"
              "                else duration_minutes\n"
              "            )\n"
              "            duration_minutes = max(5.0, float(requested_duration))\n"
          )
          if old not in content:
              if "requested_duration = (" in content:
                  print("Clamp fix already applied")
              else:
                  raise SystemExit("Expected backend clamp block not found")
          else:
              path.write_text(content.replace(old, new, 1), encoding="utf-8")
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/battery_charge_manager/manager.py
          git commit -m "Clamp all below-minimum idle durations"
          git push
