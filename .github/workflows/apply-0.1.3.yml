name: Apply 0.1.3 implementation

on:
  push:
    branches:
      - fix/0.1.3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/fix/0.1.3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Repair dialog test stub
        shell: python
        run: |
          from pathlib import Path
          path = Path("tests/test_frontend.mjs")
          content = path.read_text(encoding="utf-8")
          old = '''class FakeDialogElement {
            constructor() {
              this.scrollTop = 0;
            }
          }
          '''.replace("          ", "")
          new = '''class FakeDialogElement {
            constructor() {
              this.scrollTop = 0;
              this.listeners = new Map();
            }

            addEventListener(type, callback) {
              this.listeners.set(type, callback);
            }
          }
          '''.replace("          ", "")
          if old in content:
              path.write_text(content.replace(old, new, 1), encoding="utf-8")
          elif "class FakeDialogElement" not in content or "this.listeners = new Map();" not in content.split("class FakeDialogElement", 1)[1].split("class ShadowRootStub", 1)[0]:
              raise SystemExit("Expected FakeDialogElement test stub not found")
      - name: Apply 0.1.3
        run: python tools/apply_0_1_3.py
      - name: Compile Python
        run: python -m compileall custom_components tests tools
      - name: Frontend regression tests
        run: node --test tests/test_frontend.mjs
      - name: Frontend syntax
        run: node --check custom_components/battery_charge_manager/frontend/battery-charge-manager.js
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components CHANGELOG.md docs/version-0.1.3.md tests/test_frontend.mjs
          git commit -m "Implement Battery Charge Manager 0.1.3"
          git push
