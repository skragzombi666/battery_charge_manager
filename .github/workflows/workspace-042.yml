name: 0.4.2 source workspace
on:
  push:
    branches: [maintenance/v0.4.2-build]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Package original base with Git history
        run: git bundle create source.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: source-042
          path: source.bundle
          retention-days: 2
