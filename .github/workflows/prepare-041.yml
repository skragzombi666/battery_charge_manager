name: Prepare 0.4.1 workspace
on:
  push:
    branches: [maintenance/v0.4.1-build]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-artifact@v4
        with:
          name: source-041
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
